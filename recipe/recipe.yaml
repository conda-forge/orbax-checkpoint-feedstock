schema_version: 1

context:
  version: 0.12.8

package:
  name: orbax-checkpoint
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/o/orbax-checkpoint/orbax_checkpoint-${{ version }}.tar.gz
  sha256: fd9594cfc6dbd7881a8ce37ee9379b2a14c0e11ed49c774df1578c5ef4c6259a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - flit-core >=3.5,<4
    - pip
  run:
    - python >=${{ python_min }}
    - absl-py
    - etils
    - typing_extensions
    - msgpack-python
    - jax >=0.6.0
    - numpy
    - pyyaml
    - tensorstore >=0.1.84
    - importlib_resources
    - protobuf
    - humanize
    - aiofiles
    - simplejson >=3.16.0
    - psutil
    - uvloop
    - prometheus_client >=0.20.0
tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - "*"
      imports:
        - orbax.checkpoint
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  summary: Orbax Checkpoint
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/google/orbax

extra:
  recipe-maintainers:
    - flferretti
    - jan-janssen
    - bwohlberg
